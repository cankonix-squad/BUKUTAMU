name: CI and Production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bukutamu-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test and vet backend
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build release images
        run: |
          docker build -t bukutamu-backend:${{ github.sha }} backend
          docker build -t bukutamu-frontend:${{ github.sha }} frontend
          docker save bukutamu-backend:${{ github.sha }} bukutamu-frontend:${{ github.sha }} | gzip > images.tar.gz
          tar -czf release.tar.gz docker-compose.prod.yml scripts/deploy-production.sh images.tar.gz
      - name: Configure deployment SSH
        env:
          DEPLOY_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload and deploy exact commit
        run: |
          ssh -o BatchMode=yes root@187.77.127.202 "upload ${{ github.sha }}" < release.tar.gz
          ssh -o BatchMode=yes -o ServerAliveInterval=30 root@187.77.127.202 "deploy ${{ github.sha }}"
      - name: Verify public production
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors https://bukutamu.cankonix.com/api/health
          echo "Deployed commit ${{ github.sha }} to https://bukutamu.cankonix.com" >> "$GITHUB_STEP_SUMMARY"
